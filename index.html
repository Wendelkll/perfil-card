<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />

    <link
      rel="shortcut icon"
      href="./src/images/favicon-32x32.png"
      type="image/x-icon"
    />
    <title>Perfil de vector</title>
  </head>

  <body>
    <main class="container">
      <div class="tarjeta">
        <div class="perfil">
          <img src="./src/images/image-victor.jpg" alt="Foto de victor" />
        </div>

        <h3 class="nombre">Victor Crest <span class="edad">26</span></h3>
        <p class="ciudad">London</p>
        <hr />

        <ul class="informaciones">
          <li>
            <p class="info">80k</p>
            <span class="type-info">Followers</span>
          </li>
          <li>
            <p class="info">803k</p>
            <span class="type-info">Likes</span>
          </li>
          <li>
            <p class="info">1.4k</p>
            <span class="type-info">Photos</span>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
